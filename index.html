<script>"use strict";const LOI_TANG={tho:["Yêu thương ai đó khó người ơi,","Em đến bên anh cảm tạ trời,","Hạ mình cùng nhau sống thánh thiện,","Ánh nắng trong anh trọn một đời."],loi:["Vợ iu à,","Chồng ghi nhận sự quyết tâm của vợ.","Chồng hiểu vợ học không phải cho riêng mình. Vợ mong bố mẹ được khỏe. Vợ mong anh chị em trong gia đình ai cũng biết tự chăm lấy sức khỏe của mình. Khát vọng ấy lớn, và chồng tin vợ làm được.","Chồng trân trọng tấm lòng ấy của vợ. Chồng biết ơn vợ vì đã lo cho cả nhà mình từng ngày.","Cuốn sổ tay này chồng làm để đỡ vợ một việc: cần nhớ lời cô thì mở ra là thấy."],ky:"Chồng của vợ, Nhưỡng"},CAU_GOC="Thông thì không đau, đau thì không thông. Bệnh là do tắc. Chữa là làm cho thông, cho mềm, cho sạch.",NGUYEN_LY=[["Thông thì không đau","Bệnh do tắc, chữa là làm thông.","Bài 2"],["Khu vườn cần 3 thứ","Đủ máu, ống dẫn thông, máu sạch.","Bài 2, Bài 3"],["Mềm là sống","Cơ mềm, da đầu mềm, nội tạng mềm thì khỏe. Gan mềm mới là gan ngon.","Bài 2, Chia sẻ"],["Mỗi pháp một tầng, phải kết hợp","Khí dùng hỏa liệu, thần kinh dùng điện, máu dùng chích lễ, cơ dùng day.","Chia sẻ"],["Đầu trước, rồi từ trên xuống","Luôn bơm máu lên não trước khi làm vùng khác.","Bài 2, Bài 3"],["Đau, nhột, cứng là chỗ tắc","Đích đến là mềm, săn, không đau.","Bài 2"],["Xì ra rồi mới hết","Khi làm, cái bên trong sẽ nổi ra: đỏ, đùn mụn, chảy dịch. Qua giai đoạn đó thì hết.","Chia sẻ"],["Làm theo sức, đừng tham","Xem tình trạng người được làm, hỏi có mệt không, mệt là ngưng. Người nhịp tim cao chỉ đốt lưng, 2 lửa, tăng dần.","Chia sẻ"],["Thân và tâm phản chiếu nhau","Mỗi vùng tắc sinh một cảm xúc. Bệnh của con phản chiếu bố mẹ.","Bài 2, Bài 4"],["Thông trước, bổ sau","Chưa thông thì uống bổ cũng không vào.","Bài 4, Bài 5"]].map((n,t)=>({ma:"nl-"+(t+1),so:t+1,ten:n[0],nghia:n[1],nguon:n[2]})),TANG=[{ten:"Khí",tac:"Lạnh, nhiễm hàn, khí thân xẹp",phap:"Hỏa liệu",pp:"pp-hoa-lieu",visao:"Điện không tác động được vào khí"},{ten:"Thần kinh",tac:"Tê, mất cảm giác, liệt, yếu",phap:"Đi "Làm nóng, đẩy hàn, thải qua mồ hôi",gioihan:"Không tác động được vào thần kinh, không nắn chỉnh được",ketHop:"Đi điện (thần kinh), chích lễ (máu), day (cơ)",y:["Xem tình trạng người được làm trước khi quyết định đốt nhiều hay ít.","Hỏi “có mệt không” trong lúc làm. Mệt thì ngưng, chỉ đốt 2 lửa.","Người nhịp tim cao: đưa nhịp tim về dưới 90 trước. Chỉ đốt lưng, 2 lần. Làm dài ngày rồi mới thêm chân.","Người đã ổn mới đốt nhiều vùng, ví dụ lưng 3 lần, chân 2 lần.","Lần đầu đừng đốt cả chân, lưng và mặt trong một buổi.","Sau khi làm: mồ hôi ra có mùi; da có thể đùn mụn khô rồi bong; da mềm và ẩm hơn."],buoc:[],choBoSung:!0},{ma:"pp-di-dien",ten:"Đi điện",nhom:"chinh",tang:"Thần kinh",tac:"Làm cơ sống lại và co lên",gioihan:"Không tác động được vào khí. Chỗ đã vôi, chai, thoái hóa thì điện chịu: cây còn tươi thì dẫn điện, cây khô không dẫn điện",ketHop:"Hỏa liệu (khí), chích lễ (chỗ vôi, chai, máu ứ)",y:["Bình thường đi cách ngày cũng được, không cần đều mỗi ngày.","Bệnh nặng, có u cục: làm liền nhiều ngày thì nhanh tiêu hơn.","Có thể làm trước khi đi ngủ.","Sa tử cung: đi bụng, ngực, dọc hai bên lườn, làm đều và dài ngày.","Tim: đi ngực và sau lưng, ra vai, xuống cánh tay.","Chỗ sưng đỏ sau khi làm: đi điện tiếp, đang xì viêm ra.","Người mới học: đi điện trước cho người quen là cách đơn giản nhất."],buoc:[],choBoSung:!0},{ma:"pp-chich-le",ten:"Chích lễ",nhom:"chinh",tang:"Máu",tac:"Lấy máu ứ lâu ngày ra để cơ thể sinh máu mới",gioihan:"Kim chỉ ló khoảng 1 mm. Người mới nên hạn chế số chỗ",ketHop:"Giác hơi (tìm chỗ và hút máu), day (cơ)",y:["Dụng cụ: bút và kim thử tiểu đường, bộ giác hơi hút bằng tay, giấy ăn.","Chỉnh kim: xoay đầu bút cho kim ló khoảng 1 mm. Bật thử thấy đầu kim vừa chạm nắp là đạt. Mỗi người một kim riêng.","Mỗi ngày một vùng (hôm nay cổ vai, hôm sau lưng giữa, hôm sau thắt lưng). Cùng một vùng cách 7 ngày.","Chỗ không úp được cốc (đầu, lông mày, hõm cổ, đầu ngón tay): chích rồi nặn bằng tay tới khi hết máu đen.","Màu khi giác: trắng là thiếu máu; bầm đen là tắc nhiều; đốm đỏ là nhiễm độc kim loại; hồng và hết vết ngay là sạch.","Người máu khó đông: chỉ thử 1–2 kim.","Đã quen: bỏ bước giác đầu, chích thẳng vào chỗ cứng và đau.","Không chích vào mạch máu nổi, mạch máu to.","Không lạm dụng chích giác. Cách ít nhất 7 ngày mới giác lại chỗ cũ. Giác quá nhiều cũng sẽ khiến bị thiếu máu.","Luôn luôn lắng nghe cơ thể, giãn dần việc chích giác. Ưu tiên làm thông kinh lạc."],buoc:[["Giác để tìm chỗ tắc","Úp cốc lên vùng nghi tắc (5–10 phút). Tìm vùng bầm đen, lốm đốm đỏ, hoặc chỗ cứng và đau",10],["Chích vào vùng đó","Mở cốc. Cốc nhỏ 7 nhát, cốc vừa 14 nhát, cốc lớn 21 nhát",0],["Hút máu ra","Đặt giấy ăn vào trong cốc, úp lại đúng chỗ cũ (5–10 phút)",10],["Tháo cốc, lau máu","Để da thoáng, không cần băng, không cần cồn",0]]},{ma:"pp-day",ten:"Day massage",nhom:"ho_tro",tang:"Cơ và dây chằng",tac:"Làm mềm cơ cho máu tới nuôi, bơm máu lên não",gioihan:"Đau nên không làm liên tục được, không tới được thần kinh đã tổn thương",ketHop:"Đi trước mọi pháp: bơm máu lên não trước",y:["Ấn sâu tới sát xương rồi day tại chỗ, không trượt tay trên da.","Mỗi điểm đếm 1 tới 5 rồi chuyển sang điểm cách một ngón tay. Day lâu một chỗ là thành bấm huyệt.","Không day một chỗ quá 2 phút.","Trẻ em: nhẹ tay, kiên trì mỗi ngày. Người già: nhẹ tay, làm lâu hơn.","Bà bầu: day được, chỉ tránh huyệt Hợp Cốc.","Các mức của một chỗ tắc: cứng mà không đau (nặng, đã tê) → đau → nhột → mềm, săn, không đau (hết).","Vỗ rung bụng và ngực để tác động tới nội tạng.","Súng massage dùng cho mông, đùi: đỡ lực tay nhưng không thay được bàn tay.","Làm cho người khác: mất 2 tới 3 tiếng một buổi mới thông."],buoc:[],baiTH:"bth-bom-mau"},{ma:"pp-giac",ten:"Giác hơi",nhom:"ho_tro",tang:"Máu (tìm chỗ tắc)",tac:"Tìm chỗ tắc và hút máu sau khi chích",gioihan:"Chỉ làm ở chỗ úp được cốc",ketHop:"Chích lễ",y:["Bộ giác hút bằng tay, không dùng lửa. Tự vòng tay ra sau lưng làm được.","Úp được ở đâu là giác được ở đó: hai bên cột sống, cổ vai gáy, ngực, nách, mông, mặt.","Bơm tới khi thấy căng mà không đau.","Mỗi ngày một vùng. Cùng một vùng cách 7 ngày."],buoc:[["Úp cốc và bơm","Bơm tới khi thấy căng mà không đau (5–10 phút)",10],["Tháo cốc, xem màu","Trắng: thiếu máu. Bầm đen: tắc nhiều. Hồng và hết vết ngay: sạch",0]]},{ma:"pp-thuy-lieu",ten:"Thủy liệu",nhom:"ho_tro",tang:"Khí",tac:"Đẩy hàn tại nhà khi chưa có hỏa liệu",gioihan:"Nóng, làm tim đập nhanh. Phải ngâm theo sức",ketHop:"Day toàn thân trước",y:["Cách ngày một lần, hoặc mỗi tuần một lần.","Sau sinh: chờ khoảng 1 tháng.","Cao huyết áp, dễ ngất: day thông từ hông xuống chân trước. Ngâm tới gối, rồi tới mông, tới bụng, tăng dần.","Trẻ nhỏ: nước ấm, 2–5 phút.","Bà bầu: chỉ ngâm tới mông.","Người liệt, yếu không chịu nóng: day bóp, chích toàn thân trước, cho phơi nắng, rồi ngâm thấp tăng dần."],buoc:[["Chuẩn bị","Thùng nhựa lớn, nửa cân gừng, sả, khoảng 4 thìa canh muối biển, nước nóng ở mức chịu được như nước ngâm chân",0],["Uống nước trước khi ngâm","",0],["Ngâm","Người mới tới ngang ngực, quen rồi tới gáy. Thấy mệt là dừng",15],["Đứng dậy từ từ","Có thể hơi xây xẩm",0],["Mặc lại quần áo, nằm nghỉ","Cho mồ hôi ra hết, chưa bật quạt",30],["Uống nước ấm","Nước chanh muối hoặc nước gừng muối",0]]},{ma:"pp-thai-doc",ten:"Thải độc ruột",nhom:"ho_tro",tang:"Đường ruột",tac:"Làm sạch lớp da bên trong",gioihan:"Không uống chanh, giấm liều cao kéo dài vì mất lớp nhầy của ruột",ketHop:"Day bụng",y:["Hằng ngày: sáng uống 1 cốc nước ấm pha 1/8 tới 1/4 quả chanh và chút muối hạt, vừa miệng.","Làm sạch sâu: chọn ngày nghỉ. Ngủ dậy chưa ăn gì, uống khoảng 2 lít nước chanh muối vừa miệng. Cô làm 3 tháng một lần, sau giãn ra 6 tháng.","Gan mật: sáng chanh muối, ngày ăn cháo loãng. Tối uống 50 ml nước cốt chanh trộn 50 ml dầu mè, đi ngủ, chườm ấm bụng.","Uống mà không đi ngoài: nhu động ruột kém, cần day bụng nhiều hơn.","Đồ uống kèm: nước lá tre gai 1–2 lần mỗi tuần, mỗi lần 1–2 cốc 200 ml. Nước ép rau muống (thêm muối), cần tây."],buoc:[]}],BAI_THUC_HANH=[{ma:"bth-bom-mau",ten:"Bơm máu lên não",buoi:"",ghi:["Làm trước mọi việc khác.","Đi hết từng đường theo đường máu lên: hết nửa bên này, hết nửa bên kia, rồi mới tới đường giữa. Không day lung tung."],buoc:[["Hai bên cột sống, từ giữa lưng lên","Day cho mềm. Tự làm thì vòng tay ra sau hoặc dùng súng massage",0],["Gáy, sát hộp sọ","Ấn sâu, day, đếm 1–5 mỗi điểm",0],["Hai bên đầu (não trái, não phải)","Từ gáy lên, qua vùng trên tai, ra trán",0],["Giữa đầu","Từ giữa gáy lên đỉnh đầu, xuống trán",0],["Kiểm tra","Da đầu mềm, véo lên được, không đau là đạt",0]]},{ma:"bth-sang",ten:"Bài buổi sáng",buoi:"sang",ghi:["Làm sau khi ngủ dậy, giúp tỉnh táo.","Mỗi điểm đếm 1 tới 5 rồi chuyển sang điểm cách một ngón tay."],buoc:[["Bơm máu lên não","Hai bên cột sống lên gáy, hai bên đầu, giữa đầu",0],["Trán","Ấn sâu vào xương rồi day, không trượt trên da",0],["Cung lông mày, thái dương","Cấu và kéo nhẹ lông mày từng tí",0],["Quanh hốc mắt","",0],["Dọc hai bên sống mũi","Vuốt lên",0],["Gò má","Ấn thật sâu",0],["Vành tai, quanh tai, khớp hàm","",0],["Hàm trên, hàm dưới, dưới cằm","Chỗ nào đau thì day thêm",0],["Cổ","Véo cơ quanh cổ",0],["Xương ức, cơ ngực, xương quai xanh, nách","Cơ ngực phải véo lên được",0]]},{ma:"bth-toi",ten:"Bài buổi tối",buoi:"toi",ghi:["Làm trước khi ngủ, giúp ngủ ngon.","Các vùng từ luân xa 2 trở lên (bụng, mông, lườn, tay, chân): làm lúc nào rảnh trong ngày.","Mỗi tuần ít nhất một lần, người trong nhà làm kỹ cho nhau."],buoc:[["Bơm máu lên não","Hai bên cột sống lên gáy, hai bên đầu, giữa đầu",0],["Đỉnh đầu và da đầu","Day cho thật mềm",0],["Trán, thái dương, mặt","Như bài sáng, nhẹ hơn",0],["Ngực","",0],["Vùng luân xa 1 (nếu cần)","Làm buổi tối, nơi riêng tư",0]]},{ma:"bth-thien-thu-gian",ten:"Thiền thư giãn",buoi:"",ghi:["Gọi là thiền nhưng là thư giãn.","Hay ngủ quên giữa chừng: tập ngay sau giấc ngủ trưa, lúc tỉnh táo nhất.","Nghe buổi tối xong bị tỉnh, khó ngủ lại: chỉ nghe ban ngày.","Cô mất hơn một tháng mới nghe trọn được 30 phút."],buoc:[["Nằm hoặc ngồi thoải mái, mở bài thiền thư giãn","",0],["Nghe và thư giãn","Nhận ra đầu đang nghĩ lung tung thì quay lại nghe",30],["Cử động nhẹ rồi dậy","",0]]},{ma:"bth-thien-dong",ten:"Thiền động",buoi:"",ghi:["Hay phân tâm: tập bài thiền nạp năng lượng trước.","Sau khoảng một tháng: bỏ bài có lời dẫn, chỉ nghe nhạc, để nhu cầu bên trong tự dẫn."],buoc:[["Chọn chỗ rộng, trải nệm","",0],["Đứng, hít thở","",0],["Thả lỏng","Cơ thể muốn lắc, vươn, xoay ở đâu thì theo ở đó",0],["Luôn biết mình đang làm gì","Muốn dừng là dừng được",0]]}],CHAM_CON_TREN3=[["Day cho con","Làm nhẹ tay, từ từ cho con quen, giải thích cho con hiểu. Con nhột là chỗ đó đang tắc","Bài 2, Bài 5"],["Con khó ngủ, ngủ không sâu","Bơm máu lên não cho con trước khi ngủ","Bài 5"],["Con hay ốm vặt, yếu","Lưng, cổ, đầu con phải mềm. Day hai bên cột sống thường xuyên","Bài 5"],["Con ăn ít, kém hấp thu","Day lưng, vỗ rung bụng. Thủy liệu nước ấm 2–5 phút, xong con sẽ đói","Bài 5"],["Bữa ăn","Ngồi ăn, tập trung ăn, nhai kỹ. Không ép, không ăn rong, không xem iPad. Ăn vặt rồi bỏ bữa thì chờ tới bữa sau","Bài 5"],["Giờ ăn","Nên ăn trước khi mặt trời lặn, khoảng 6 giờ tối","Bài 5"],["Ho, nghẹt mũi, khò khè khi ngủ","Bơm máu lên não, day mũi, cổ, ngực. Đắp khăn ấm nhúng nước lá trầu lên mặt cho con ngửi","Bài 4, Bài 5"],["Răng, hàm","Day hàm cho con để hàm phát triển đủ chỗ cho răng","Bài 2, Bài 4"],["Con sốt","Chườm ấm, da kề da, đánh trứng bạc, ngâm nước tía tô pha muối khoảng 5 phút rồi lau khô","Bài 5"],["Tẩy giun","Nước rau sam luộc. Dấu hiệu nhiều giun: bụng to người gầy, ngứa hậu môn","Bài 5"],["Lưỡi trắng, nấm lưỡi","Lá bàng hoặc rau ngót giã với muối, vắt nước bôi. Hoặc dầu dừa","Bài 5"],["Chơi","Cho con đi chân trần, chơi ngoài trời, tiếp nắng","Bài 5"],["Tắm mưa","Chỉ khi trời ấm và mưa đã lâu, sân đã mát","Bài 5"],["Cân nặng","Sau 1 tuổi tăng khoảng 2 kg mỗi năm là bình thường","Bài 5"],["Nề nếp","Con cần cả tự do và quy củ. Dạy con biết chỗ nào được tự do, chỗ nào phải theo nội quy","Bài 5"],["Tâm lý của con","Bố mẹ sửa mình trước. Trò chuyện, chơi với con nhiều","Bài 2, Bài 4"]],CHAM_CON_NHO=[["3 ngày đầu","Mẹ chỉ có sữa non, nhiều kháng thể. Đủ sữa khi số lần tè tăng mỗi ngày một lần: ngày 1 một lần, ngày 7 khoảng 6–8 lần. Không cho bú bình đầu tiên"],["Tuần đầu tới 1 tháng","Bé quấy do đầy hơi: chườm ấm bụng, đắp lá trầu. Rốn rụng sau 3–7 ngày rồi mới tắm. Tắm xong massage cho bé. Mẹ ăn chín uống sôi"],["Tới 6 tháng","Bú theo nhu cầu. Cân nặng 6 tháng gấp đôi lúc sinh"],["6–7 tháng","Bắt đầu ăn dặm khi phân có mùi thối, chờ thêm 3–4 tuần. Hai tuần đầu bột gạo không nêm, sau thêm 1 củ 1 rau"],["7–8 tháng","Cháo kèm rau củ"],["8–12 tháng","Cơm nát, tập nhai. Múc phần của bé trước khi nêm. Sữa mẹ vẫn là chính. Cân nặng 12 tháng gấp ba lúc sinh"],["12–18 tháng","Bú 3–4 cữ mỗi ngày, có giờ"],["18–24 tháng","Bú 2–3 cữ"],["Khoảng 2 tuổi","1–2 cữ, mỗi cữ 5–10 phút"],["Khoảng 2,5 tuổi","1 cữ 5 phút, rồi cai. Giảm dần, không cắt đột ngột"],["Cai bú đêm (20–22 tháng)","Nói trước với con một tuần, nhờ bố dỗ khi con thức"]],DI_VIEN=[["Con sốt quá cao mà mình không kiểm soát được tình hình","Bài 5"],["Sau khi ngã đập đầu: cứng cổ, mắt lác, nôn ói","Bài 1"],["Da con tím, tái","Bài 5"],["Bé sơ sinh quá 24 giờ không bú","Bài 5"],["Bé dưới 3 tháng bị sốt","Bài 5"],["Vàng da lan tới bàn tay, bàn chân và mắt","Bài 5"],["Co giật, khó thở, li bì khó đánh thức: gọi 115","Ghi thêm"]].map((n,t)=>({ma:"dv-"+(t+1),noi_dung:n[0],nguon:n[1]})),BAI_RAW=[{ma:"b1",so:1,ten:"Đại cương về cơ thể người",nguon:"Bài 1",video:"https://youtu.be/wsZRP5BxdgI?si=_SZiUQnuWTSqit0w",rumble:"https://rumble.com/v3amlsn-cssk-k5-b1-i-cng-v-c-th-ngi.html",muc:[{ten:"Cơ thể gồm hai phần",the:[["Thân vật lý và khí thân","Cơ thể người không chỉ là thân vật lý: da, thịt, xương, nội tạng mà mắt nhìn thấy. Bao quanh còn có khí thân, một lớp từ trường sinh học. Mắt thường không thấy nhưng đo được.\nTây y học trên giải phẫu cơ thể người chết. Đông y chữa trên cơ thể người sống, gồm cả phần khí thân này.",0],["Khí thân khỏe và khí thân yếu","Người bình thường có khí thân rộng khoảng 1–2 m. Khí thân khỏe to, tròn, đều, giống quả táo.\nChỗ nào mới đau thì khí dồn về, phình ra (nghĩ nhiều thì đầu phình). Chỗ nào bệnh lâu thì xẹp lại. Người càng bệnh nặng, khí thân càng nhỏ.",0],["Khí thân ở chỗ đông người","Vào thang máy chật người, dù không ai chạm ai vẫn thấy khó chịu. Đó là các khí thân chạm nhau nên tự co lại để bảo vệ.\nCo lại một lúc thì bình thường. Phải co mãi thì lâu dần thành bệnh. Cách chữa: tiếp xúc thiên nhiên nhiều hơn, ra khỏi phòng máy lạnh, ra ngoài trời hít thở.",0],["Khí chuyển động thế nào","Khí thân không đứng im mà chuyển động lên xuống, ra vào. Phía trên hấp thu, phía dưới xả ra.\nMình ăn, uống, nghe, nhìn từ trên vào; thải ra, nói ra, tay làm, chân đi ở phía dưới. Cơ thể như một cục pin năng lượng sinh học, có thu có phát. Con người và vũ trụ là một: từ trường quanh mình giống từ trường trái đất.",0],["Kinh lạc","Vì khí có đường đi nên có kinh lạc. Kinh lạc không phải đường đi của máu, cũng không phải đường đi của dây thần kinh, mà là một đường vô hình nối toàn thân từ đầu xuống dưới.",0]]},{ten:"Đo khí thân (bài tập về nhà)",the:[["Làm que đo","Lấy một móc treo quần áo bằng kim loại, cắt và bẻ thành 2 que hình chữ L.\nCầm que nằm ngang trong tay, không chặt quá, không lỏng quá: que đu đưa được, nhưng mỗi bước chân đi vẫn đứng yên được.",0],["Cách đo","Đứng cách người cần đo khoảng 4–5 m, đi lại thật từ từ. Bình thường que vẫn song song với người mình.\nKhi chạm khí thân của người kia, que bị đẩy. Càng vào sát, que càng xoay mạnh rồi áp vào người. Để que cao để đo đầu, hạ thấp để đo ngực, hông, chân, xem chỗ phình, chỗ xẹp.",0]]},{ten:"Bảy luân xa",the:[["Luân xa là gì","Luân là quay, xa là bánh xe. Dọc trục cơ thể từ bộ phận sinh dục lên đỉnh đầu, theo cột sống, có 7 luân xa. Trục này đi qua nhiều huyệt quan trọng và các tuyến nội tiết. Mỗi luân xa tạo thành một lớp của khí thân.",0],["Vị trí 7 luân xa","1. Bộ phận sinh dục\n2. Dưới rốn 1 thốn (khoảng 1 đốt ngón tay cái)\n3. Dạ dày, tuyến tụy\n4. Tim, giữa ngực\n5. Họng, tuyến giáp\n6. Giữa trán\n7. Đỉnh đầu, huyệt Bách hội",0],["Đừng tập để mở luân xa","Luân xa sẽ tự mở khi mình sẵn sàng. Đừng nghe ai mà tập mở khi chưa vững năng lượng gốc, cũng đừng đi chuyển năng lượng cho người khác để chữa bệnh.\nLuôn giữ được kiểm soát: làm để biết nó là gì, nhưng không bị lôi đi. Không kiểm soát được hành động thì dừng ngay. Kể cả cô Thảo dạy, mình cũng phải tự kiểm chứng.",0],["Tự làm sạch khí quanh mình","Đưa tay xoa, vuốt quanh toàn thân mà không chạm người. Mỗi lần nghĩ đến, tập trung vào nó là phần khí quanh mình được làm sạch.\nChỉ dừng ở đó, như rửa mặt hằng ngày. Đừng nghĩ sẽ dùng để chữa cho người khác.",0]]},{ten:"Âm dương",the:[["Âm dương là quy ước","Mọi thứ trên đời đều có âm và dương. Các trường phái chia khác nhau vì quy ước khác nhau, không mâu thuẫn.\nVí dụ quả ớt: thực dưỡng xếp vào âm, Đông y xếp vào dương vì tính ấm nóng. Ban ngày quy ước là dương thì ban đêm là âm.",0],["Từ một sinh ra tám","Toàn thể tách làm hai: âm và dương. Hai sinh ra tứ tượng: thái dương, thiếu âm, thái âm, thiếu dương, như bốn phần của một ngày. Tứ tượng sinh ra bát quái, tám quẻ.",0],["Âm dương trên cơ thể","Phía trên là dương, phía dưới là âm. Cơ thể chia ba vùng: thượng tiêu, trung tiêu, hạ tiêu.\nKhông như Tây y chữa riêng cái chân, Đông y xem vùng nào đang tắc nghẽn.",0],["Cân bằng động","Âm dương phải cân bằng thì không sinh bệnh, và đó là cân bằng động. Tối là âm thì ngủ, ngày là dương thì làm việc. Hoạt động theo thời tiết là cân bằng.\nTrong âm có dương, trong dương có âm: phụ nữ bên ngoài mềm yếu nhưng bên trong mạnh mẽ, bền bỉ; đàn ông bên ngoài cứng cỏi nhưng bên trong vẫn cần được vỗ về.",0],["Ăn theo mùa, ăn sống vừa phải","Thả lỏng lắng nghe thì cơ thể tự hòa theo khí hậu: mùa đông thích đồ kho, xào; mùa hè thích đồ luộc, trái cây.\nĂn sống nhiều thì phải phơi nắng nhiều. Cây có enzym tự bảo vệ; nấu qua lửa thì enzym bớt tác dụng, ruột dễ hấp thu. Ruột người không khỏe như ruột thú rừng, nên ăn sống vừa phải.",0]]},{ten:"Ngũ hành",the:[["Năm hành và năm tạng","Vạn vật tạo bởi 5 yếu tố, ứng với 5 tạng và 5 vị:\n• Kim (khí) – phổi – cay\n• Thủy – thận – mặn\n• Mộc – gan – chua\n• Hỏa – tim – đắng\n• Thổ – dạ dày – ngọt\nVị nào sẽ dẫn thuốc vào tạng đó.",0],["Tương sinh, tương khắc","Tương sinh: Kim → Thủy → Mộc → Hỏa → Thổ → Kim. Phổi tốt nuôi thận, thận tốt nuôi gan, gan tốt nuôi tim, tim tốt nuôi dạ dày, dạ dày tốt nuôi phổi.\nTương khắc: Thủy khắc Hỏa, Hỏa khắc Kim, Kim khắc Mộc, Mộc khắc Thổ, Thổ khắc Thủy.",0],["Ngũ hành trong bữa cơm Việt","Bát nước chấm có đủ chua, cay, mặn, ngọt. Bị ho thì thuốc phải có chút vị cay; bệnh thận thì có chút vị mặn, vì vị dẫn thuốc vào tạng.\nRau gia vị Việt Nam (hành, gừng, sả, tỏi, riềng, rau thơm) đều là thuốc. Tự nhiên thèm vị nào là cơ thể đang báo cần vị đó.",0]]},{ten:"Ăn uống tự nhiên",the:[["Ăn đồ mọc từ đất","Quan trọng nhất là đồ ăn từ dưới đất mọc lên. Vị tự nhiên luôn có nhiều vị trong một: mía có chút chua, chút mặn; chuối rừng có chút chát; hạt muối biển có mặn, chát, ngọt.\nDùng đường mía, muối hạt, nước mắm truyền thống.",0],["Tránh đồ hóa chất","Bột ngọt, bột nêm, đường tinh luyện, hương liệu giả không phải đồ ăn cơ thể nên ăn. Kẹo vị dâu không làm từ dâu: mũi ngửi thấy dâu, bụng không thấy dâu, cơ thể bối rối, lâu dần rối loạn chuyển hóa.\nLuôn đọc thành phần đồ mua về. Có hóa chất thì không dùng hoặc hạn chế.",0],["Không kiêng cực đoan","Mọi vị lưỡi cảm nhận được (chua, cay, mặn, ngọt, đắng, chát, bùi, béo) đều tốt và đều cần. Tiểu đường vẫn cần đường, ăn thanh đạm vẫn cần chất béo. Kiêng hẳn là đi về phía cực đoan.",0],["Lắng nghe cơ thể","Con chó, con mèo nhìn và ngửi là biết đồ nào ăn được. Người cũng vậy: khí thân chạm vào đồ không hợp là đã thấy khó chịu. Càng ăn đồ hóa chất, mình càng mất bản năng ấy.",0]]},{ten:"Thiền động",the:[["Thiền động là gì","Thả lỏng toàn bộ, để cơ thể vận động theo nhu cầu của nó: mỏi cổ thì lắc cổ, mỏi tay thì vẫy tay. Không đưa mình đến cảnh giới nào. Mình luôn quan sát, biết rõ cơ thể đang làm gì, không bị chìm, không bị lạc.",0],["Vì sao cần thiền động","Kinh lạc phải thẳng, như ống nước. Bị vặn xoắn, co rút thì co bóp. Những điều mình muốn làm mà vì lý do nào đó không làm sẽ thành tắc nghẽn, ban đầu một, lâu dần thành nhiều. Thiền động giúp thả ra.",1],["Bài tập về nhà","• Đo khí thân cho từng người, rồi đo từng bộ phận.\n• Tập thiền động. Ai đang yếu thì tập bài thiền nạp năng lượng trước một thời gian.",0]]}]},{ma:"b2",so:2,ten:"Tâm bệnh",nguon:"Bài 2",video:"https://youtu.be/Q-60ZtK92UA?si=PIbQSIcm5fQMXOxS",rumble:"https://rumble.com/v3amm9s-cssk-k5-b2-tm-bnh.html",muc:[{ten:"Bệnh đến từ đâu",the:[["Bốn yếu tố tạo nên cơ thể","Đất: thứ mình ăn vào. Nước: thứ mình uống vào. Gió: hơi thở. Lửa: cảm xúc, tâm trạng, nóng giận.\nBài này học về lửa, tức là tâm bệnh: bệnh xuất phát từ bên trong.",9],["Cảm nhận năng lượng ở bàn tay","Khi thả lỏng và thiền cho hai bàn tay, có thể cảm nhận khí trong lòng bàn tay. Bàn tay là bàn tay trị liệu, cảm nhận được năng lượng người xung quanh. Trước khi cảm được, dùng que đo để chắc chắn nó có thật.",0],["Tập thiền động cho đúng","Chọn khu vực rộng, trải nệm xuống sàn. Đứng hít thở trước, rồi thả lỏng. Lắc lư là nhu cầu của cơ thể, không phải ai làm mình lắc.\nHay phân tâm thì tập bài thiền nạp năng lượng trước. Tập khoảng một tháng thì bỏ bài có lời dẫn, chỉ nghe nhạc, để nhu cầu tự bên trong dẫn.",0]]},{ten:"Bảy luân xa và tâm bệnh",the:[["Luân xa 1 – đỏ – năng lượng đất","Vị trí: bộ phận sinh dục, là luân xa gốc. Gốc lệch thì cả cây lệch: mông co bóp, xương cụt vẹo thì cổ vai gáy cũng đau.\nKhi khỏe: vững vàng, quyết liệt, ổn định, tư duy rõ. Gắn với kết nối cha mẹ, vợ chồng, con.\nKhi tắc: dễ chán nản, thấy bị bỏ rơi, dễ thất vọng.\nVùng làm: hai bên sát hậu môn, tầng sinh môn, vùng mu, háng. Tần số 396 Hz.",9],["Luân xa 2 – cam – năng lượng nước","Vị trí: dưới rốn 1 thốn.\nKhi khỏe: can đảm, hăng hái, cởi mở, hòa đồng, linh hoạt.\nKhi tắc: hay tức giận, hận thù, kiêu hãnh.\nVùng làm: từ mu lên rốn, cả trước và sau: bụng dưới, mông, thắt lưng xuống xương cụt. Liên quan thận, gan, bàng quang, thần kinh tọa. Tần số 417 Hz.",9],["Luân xa 3 – vàng – năng lượng lửa","Vị trí: dạ dày, tuyến tụy.\nKhi khỏe: quyết đoán, lạc quan, yêu đời.\nKhi tắc: thiếu tự tin, sức chịu đựng kém, lo sợ, đổ lỗi.\nVùng làm: từ rốn lên, cơ liên sườn. Tuyến tụy liên quan tiểu đường. Tần số 528 Hz.",9],["Luân xa 4 – xanh lá – năng lượng không khí","Vị trí: tim, giữa ngực. Ai đang học về tình yêu sẽ thích màu xanh lá.\nKhi khỏe: yêu vô điều kiện, từ bi, thấu hiểu.\nKhi tắc: cô đơn, ghen tuông, yếu đuối, phụ thuộc.\nVùng làm: xương ức, quanh ngực, nách, xương quai xanh, lưng trên. Đau khổ về tình cảm thì day xương ức sẽ rất đau: tự day là tự yêu mình.",9],["Luân xa 5 – xanh da trời – không gian","Vị trí: họng, tuyến giáp.\nKhi khỏe: truyền đạt thông tin, ý tưởng.\nKhi tắc: thiếu tự tin khi giao tiếp, khó diễn đạt.\nVùng làm: toàn bộ cổ: gáy sát hộp sọ, hai bên cổ, tuyến giáp, trước cổ. Tần số 741 Hz.",9],["Luân xa 6 – chàm – thời gian, hiểu biết","Vị trí: giữa trán, thông ra sau gáy.\nKhi khỏe: hiểu biết, trí tuệ, trực giác.\nKhi tắc: ảo giác, mơ mộng viển vông.\nVùng làm: trán, lông mày, hốc mắt, mũi, gò má, quanh tai, khớp hàm, hàm trên, hàm dưới. Tần số 852 Hz.",9],["Luân xa 7 – tím hoặc trắng","Vị trí: đỉnh đầu, huyệt Bách hội.\nKhi khỏe: mở rộng, bình an, đón nhận.\nKhi tắc: lạc lõng, ngộ nhận. Liên quan mất ngủ, trầm cảm, tăng động, tự kỷ.\nVùng làm: toàn bộ da đầu. Tần số 963 Hz.",9],["Màu sắc và luân xa","Bảy luân xa là bảy màu cầu vồng. Mình thích màu nào, thích mặc màu nào, thích đến nơi có màu nào là luân xa màu đó đang cần được chữa. Đồ ăn cũng mang màu của luân xa. Nhạc tần số nghe lúc nào cũng được.",0]]},{ten:"Cách day ấn",the:[["Ấn sâu, day tại chỗ","Ấn sâu tới sát xương rồi day tại chỗ, không trượt tay trên da. Mỗi điểm đếm 1 tới 5 rồi chuyển sang điểm cách đó một ngón tay. Day một chỗ quá lâu là thành bấm huyệt, mà chưa học huyệt thì không bấm.",6],["Cơ thể từ ngoài vào trong","Khí thân → da → mỡ → cơ → xương. Mạch máu chính và dây thần kinh nằm trong cơ. Cơ co bó thì bóp mạch, máu không đến nuôi, cơ chết dần, kéo lệch xương.\nVì vậy phải làm sâu tới gần xương cho cơ sống lại. Cơ teo chỉ còn như sợi dây thì càng phải làm.",3],["Đau, nhột, cứng là chỗ tắc","Day vào mà đau là tắc. Nhột cũng là tắc. Cứng mà không còn cảm giác là tắc nặng. Đích đến: da thịt mềm, săn, không đau, bóp vào chỉ thấy như bóp da thịt bình thường.",6],["Thứ tự khi tự làm","Sáng sau khi ngủ dậy và tối trước khi ngủ: day đầu, mặt và ngực. Làm tối giúp ngủ ngon, làm sáng giúp tỉnh táo. Lúc nào rảnh thì tự xoa bóp các phần dưới và tay chân.\nLuân xa 1 làm buổi tối, nơi riêng tư. Từ luân xa 2 trở lên ngồi đâu cũng làm được.",5],["Thứ tự khi làm cho người khác","Luôn làm liệu trình bơm máu lên não trước: từ giữa lưng lên trên đầu. Não khỏe rồi mới chia sức đi sửa chữa các bộ phận khác.\nSau đó làm từ đầu xuống chân, làm hết một lượt, không làm nửa chừng rồi quay sang tay.",5],["Cơ thể là khu vườn","Khu vườn cần ba thứ: đủ nước để tưới (đủ máu), ống dẫn nước thông (day ấn làm việc này), nước sạch (máu sạch). Làm thông trước, ăn uống làm sạch sau.",2],["Lực tay theo người","Trẻ em: làm nhẹ tay. Người già chịu đau kém: lực nhẹ hơn nhưng làm lâu hơn ở mỗi vùng. Người trẻ khỏe: làm mạnh hơn. Bà bầu làm được, chỉ tránh huyệt Hợp Cốc. Có thể dùng súng massage trợ lực, nhưng không bằng tay người.",8],["Thoái hóa, thoát vị cột sống","Hai bên cột sống có cơ giữ. Một bên co nhiều, lâu ngày kéo hở khớp giữa hai đốt, đĩa đệm lệch ra thành thoát vị. Cả hai bên cùng co thì ép xẹp đĩa đệm.\nLàm giãn, làm mềm hết cơ thì cơ tự kéo cột sống về. Nặng quá thì cần người làm trực tiếp.",3],["Yoga từ bên trong","Yoga, múa là tư thế người khác áp cho mình. Thiền động là bên trong cần gì thì vận động theo. Tập lâu, chuyển động tinh tế, sâu, nhịp nhàng hơn và tự ra các động tác yoga hợp với mỗi người.",0],["Diện chẩn dùng vừa phải","Diện chẩn rất hay với một số bộ: cầm máu, thông nghẽn nghẹt, tan máu bầm. Hơi sổ mũi, hắt xì là bấm cho ngưng ngay là lạm dụng, tắt mất cơ chế tự vệ của cơ thể.\nCây lăn mặt, lăn đầu chỉ làm tổn thương da; dùng tay ấn sâu tốt hơn.",0]]},{ten:"Tâm bệnh trong gia đình",the:[["Bệnh của con phản chiếu mình","Thường mình có vấn đề gì thì con có vấn đề tương tự. Chữa cho con mới chỉ là phần thể chất. Phải quay về nhìn mình, sửa được mình thì con thấy và thay đổi theo.\nLâu lâu mở lại bài này để xem mình đang ở trạng thái nào.",9],["Chữa cho trẻ nhanh hơn","Trẻ con hồi phục rất nhanh. Con cô Thảo sinh ra chân lật hẳn ra, nắn và day bóp khoảng một tháng thì thẳng lại.\nMẹ co rút thì con cũng co rút, như phôi xà phòng lỗi thì bánh xà phòng lỗi theo. Làm cho trẻ con là sửa từ đời sau.",0]]}]},{ma:"b3",so:3,ten:"Một số phương pháp chăm sóc sức khỏe không dùng thuốc",nguon:"Bài 3",video:"https://youtu.be/BHapzNm0FDc?si=PI5-QAE7s1PR6kEX",rumble:"https://rumble.com/v3amn7m-cssk-k5-b3-mt-s-phng-php-cssk-khng-dng-thuc.html",luuY:["Không chích vào mạch máu nổi, mạch máu to.","Không lạm dụng chích giác. Cách ít nhất 7 ngày mới giác lại chỗ cũ. Giác quá nhiều cũng sẽ khiến bị thiếu máu.","Luôn luôn lắng nghe cơ thể, giãn dần việc chích giác. Ưu tiên làm thông kinh lạc."],muc:[{ten:"Day massage",the:[["Không day một chỗ quá 2 phút","Mỗi điểm đếm 1–5 rồi chuyển. Quan trọng là làm mềm toàn bộ vùng đó, không phải ấn mãi một điểm.",6],["Luôn bơm máu lên não trước","Thần kinh trung ương tập trung trên đầu. Chữa bệnh gì cũng phải làm từ giữa lưng lên đầu trước.\nDa đầu phải mềm, véo lên được mà không đau. Da đầu cứng, dính sát sọ thì khô dần, nhìn hốc hác, già nhanh.",5],["Da đầu của trẻ","Trẻ nào da đầu mềm đều thì khỏe, ăn chơi không quấy. Trẻ có vấn đề tuần hoàn máu não thì da đầu không mềm.\nLàm cho con nhẹ tay nhưng kiên trì mỗi ngày, ấn vào xương rồi day, không trượt trên da.",3],["Làm bằng tình thương","Năng lượng tình yêu đi từ luân xa 4, từ trái tim tới trái tim. Làm cho ai cũng phải thương người đó, không phải để thể hiện mình giỏi hay để kiếm tiền.",0]]},{ten:"Thủy liệu",the:[["Thủy liệu đẩy hàn","Phương pháp này trục hàn rất tốt. Người nhiễm hàn sâu thì cơ co vào xương, máu không ra được ngoài: chân hàn mà giả nhiệt, ra mồ hôi lạnh, càng ra càng lạnh.\nNgâm trong nước nóng có gừng, sả, muối thì hàn đẩy ra được trung hòa ngay, không ngấm ngược lại.",4],["Chuẩn bị và ngâm","Thùng nhựa, khoảng nửa cân gừng, sả, khoảng 4 thìa canh muối biển (muối là chất dẫn, có điện giải), nước nóng mức chịu được như nước ngâm chân.\nUống nước trước. Người mới ngâm tới ngang ngực, quen thì tới gáy, 10–15 phút. Đứng dậy từ từ, mặc lại quần áo, nằm nghỉ khoảng 30 phút cho mồ hôi ra hết rồi mới dùng quạt.",0],["Ai ngâm thế nào","• Cách ngày một lần, hoặc tuần một lần.\n• Sau sinh: chờ khoảng 1 tháng.\n• Cao huyết áp, dễ ngất: day thông từ hông xuống chân trước, ngâm tới gối, rồi mông, rồi bụng, tăng dần.\n• Trẻ nhỏ: nước ấm, 2–5 phút.\n• Bà bầu: ngâm tới mông.\n• Người liệt, yếu không chịu nóng: day bóp, chích toàn thân trước, cho phơi nắng, rồi ngâm thấp tăng dần.",8]]},{ten:"Giác hơi",the:[["Bộ giác hút tay","Dùng bộ giác hút bằng tay, không dùng lửa, tự làm được cả sau lưng. Úp được cốc ở đâu thì giác được ở đó: hai bên cột sống, cổ vai gáy, ngực, nách, mông, mặt. Úp 5–10 phút.",0],["Đọc màu khi giác","Màu trắng: thiếu máu. Bầm đen: tắc nhiều, độc nhiều. Đốm đỏ: nhiễm độc kim loại. Hồng và trở lại màu da ngay: máu đã sạch. Làm nhiều lần thì vết tròn thâm mất dần.",0],["Mỗi ngày một vùng","Mới làm thì chia ra: hôm nay cổ vai, hôm sau giữa lưng, hôm sau thắt lưng. Cùng một vùng thì 7 ngày sau mới giác lại, cho da lành.",8]]},{ten:"Chích lễ",the:[["Vì sao phải chích","Ăn uống, nước ép, xông hơi thải được một phần. Nhưng thứ đã chích vào máu thì phải lấy ra bằng đường máu.\nCơ thể gom những gì nó không dùng được để giữ lại ở các điểm gần hệ bạch huyết, nhiều nhất là dọc sống lưng. Chích lễ hút máu đen ra để cơ thể sinh máu sạch.",2],["Dụng cụ và chỉnh kim","Bút thử tiểu đường và kim thử tiểu đường. Xoay đầu bút cho kim chỉ ló khoảng 1 mm, bật thử thấy đầu kim vừa chạm nắp là đạt. Mỗi người một kim riêng. Kim chỉ 1–2 mm nên không đi sâu vào trong.",0],["Các bước","1. Giác trước để tìm chỗ tắc: vùng bầm đen, lốm đốm, hoặc chỗ cứng, đau.\n2. Mở cốc, chích vào vùng đó: cốc nhỏ 7 nhát, cốc vừa 14, cốc lớn 21.\n3. Đặt giấy ăn vào cốc, úp lại đúng chỗ, hút máu ra 5–10 phút.\n4. Tháo cốc, lau máu, để da thoáng.\nĐã quen thì bỏ bước 1, chích thẳng chỗ cứng và đau.",0],["Máu tự biết dừng","Chỗ có máu đen, máu độc thì cơ thể có xu hướng đẩy ra. Ra tới máu đỏ tươi thì tự dừng. Có lỗ kim ra nhiều, có lỗ ra ít rồi ngừng. Không ra máu là chỗ đó khô hoặc không có máu tới, cần làm thêm.",0],["Sau khi chích","Lau máu đi là được, không cần cồn vì cồn cũng không tốt cho da. Để thoáng thì không nhiễm trùng, băng kín mới dễ nhiễm.\nNgười máu khó đông chỉ thử 1–2 kim, ưu tiên day và thủy liệu, uống thêm lá tre gai.",8],["Chích ở đâu","Không có điểm cấm kỵ. Trên đầu có điểm đau thì chích, cả lông mày, hõm cổ, đầu ngón tay, vết sẹo. Chỗ không úp được cốc thì chích rồi nặn bằng tay tới khi hết máu đen.",0]]},{ten:"Thải độc ruột",the:[["Ruột là lớp da thứ hai","Da ngoài được tắm hằng ngày, còn ống tiêu hóa từ miệng xuống hậu môn là lớp da bên trong không bao giờ được tắm. Thời nay ăn nhiều đồ khó tiêu, uống nhiều thuốc nên ruột cần được làm sạch.",2],["Chanh muối ấm buổi sáng","Buổi sáng uống 1 cốc nước ấm pha 1/8 tới 1/4 quả chanh tươi và chút muối hạt, vừa miệng. Uống hằng ngày hoặc vài ngày một lần là đã thải độc ruột. Đau dạ dày vẫn uống được, nhấm thêm chuối khô ngâm muối.",0],["Làm sạch sâu","Chọn ngày nghỉ. Ngủ dậy chưa ăn gì, uống khoảng 2 lít nước chanh muối vừa miệng. Cô làm 3 tháng một lần, sau giãn ra 6 tháng.\nUống mà không đi ngoài là nhu động ruột kém: day bụng nhiều hơn.",0],["Gan mật","Sáng uống chanh muối, trong ngày nhịn hoặc ăn cháo loãng. Tối uống khoảng 100 ml gồm 50 ml nước cốt chanh và 50 ml dầu mè (hoặc dầu dừa), đi ngủ, chườm ấm bụng. Hôm sau có thể ra những cục mềm màu đỏ, xanh hoặc nâu.",0],["Đừng rửa quá tay","Uống chanh hay giấm liều cao mỗi ngày sẽ mất lớp nhầy của ruột, hại ruột. Cái gì quá cũng không tốt.",0]]},{ten:"Đồ uống hỗ trợ",the:[["Lá tre gai, nước ép rau","• Lá tre gai: giúp tan cục máu đông. Tuần 1–2 lần, mỗi lần 1–2 cốc 200 ml. Tính mát, uống nhiều dễ tụt huyết áp.\n• Nước ép rau muống (thêm muối), cần tây và các loại rau họ cần: giúp thải kim loại.",0],["Thuốc bổ phải thông trước","Thuốc Đông y hầu hết là thuốc bổ: yếu đâu bổ đó. Nhưng cơ thể phải thông thì thuốc mới đi tới nơi cần. Không thông thì uống bổ cũng không hấp thu.",10]]}]},{ma:"b4",so:4,ten:"Một số bệnh thường gặp",nguon:"Bài 4",video:"https://youtu.be/Gfdy50dS-RM?si=-2Ii8SmiL40BicJI",rumble:"https://rumble.com/v3amnx8-cssk-k5-b4-mt-s-bnh-thng-gp.html",muc:[{ten:"Nguyên tắc chung",the:[["Khí huyết lưu thông thì bệnh lui","Khí huyết lưu thông thì gần như mọi bệnh biến mất. Bài này chia cơ thể từ trên xuống, xem bệnh nằm ở vùng nào thì làm thông vùng đó.",1],["Một tuần làm kỹ cho nhau một lần","Hằng ngày tự làm cho mình phần đầu. Mỗi tuần ít nhất một lần người trong nhà làm kỹ cho nhau. Một buổi trị liệu của cô kéo dài 2 tới 3 tiếng mới thông được.",0]]},{ten:"Đầu và mặt",the:[["Day ngực trước khi day đầu","Huyết áp thấp, tiền đình, chóng mặt: làm thông ngực trước. Cơ ngực dù người gầy vẫn phải có thịt véo lên được, không dính sát xương ức. Cơ này nâng lồng ngực khi thở.",5],["Day đầu theo đường máu","Đi hết từng đường: hai bên cột sống lên gáy, nửa đầu trái, nửa đầu phải (phụ trách vận động tay chân), rồi từ giữa gáy lên đỉnh, xuống trán (phụ trách tai, mắt, mũi, miệng). Không day lung tung, hú họa.",5],["Da đầu mềm thì hết rụng tóc","Da đầu lỏng ra, không dính sọ là rụng tóc giảm hẳn, ngủ sâu hơn, ít mơ. Điểm nào đau nhói thì chích một phát.\nTóc bạc sớm thì phải uống thêm bổ máu, nhưng vẫn phải làm thông trước.",3],["Trẻ đầu to","Trẻ đầu to, cổ nhỏ như củ khoai cắm trên que tăm, não phát triển rất mạnh 6 năm đầu. Day nhiều vùng gáy, cổ cho con thì con thông minh, ít bị rối loạn tuần hoàn máu não.",0],["Xoang, mũi, mắt, tai","Xoang, viêm mũi, chảy máu cam: day lông mày, dọc sống mũi, gò má.\nMắt: day quanh hốc mắt, ấn sâu vào góc mắt.\nTai: day vành tai, quanh tai; viêm tai giữa thì hơ ấm. Trẻ có vết thâm chỗ khớp hàm thì day mạnh vùng đó.",0],["Răng và hàm","Day sâu vào má sát hàm răng, từ khớp hàm xuống cằm. Chỗ nào đau là răng chỗ đó có vấn đề. Làm cho trẻ thì hàm phát triển đủ chỗ, răng không mọc lệch. Răng lung lay sẽ chắc lại, cao răng và sâu răng cải thiện.",0],["Mặt đẹp từ bên trong","Làm sâu vào lớp cơ mặt, không chỉ xoa ngoài da như spa. Cơ sống lại thì da căng, mềm như da em bé, bớt nám, tàn nhang, nếp nhăn, gò má cân đối. Bóp môi cho môi hồng lên.",3],["Xông lá trầu","Lá trầu có kháng sinh tự nhiên dễ bay hơi. Vò lá trầu, đun với ít muối, xông mặt, há miệng hớp hơi, hít bằng mũi: sạch khoang miệng, khoang mũi, mắt.\nTrẻ nhỏ thì đắp khăn nhúng nước lá trầu ấm lên mặt cho con ngửi.",0]]},{ten:"Cổ và ngực",the:[["Cổ: cơ teo thành sợi dây","Người khỏe sờ trước cổ có cục thịt to bằng ngón út. Người hay ngứa cổ, ho, đau họng lâu năm thì chỉ còn sợi dây, là cơ đã teo. Cấu véo quanh cổ hằng ngày cho cơ sống lại. Hõm cổ có cục đau thì chích.",3],["Tuyến giáp và ăn uống","Bệnh tuyến giáp thường do ăn sai: nhiều hóa chất, đường tinh luyện, bột ngọt. Day cổ phải đi kèm đổi cách ăn, không thể cứ ăn thoải mái rồi day là hết.",2],["Ngực, nách, tay","Bóp sâu quanh ngực, nách, xương quai xanh hằng ngày tới khi không đau. Cải thiện ít sữa, u cục, tức ngực, khó thở, hôi nách.\nMồ hôi tay: làm từ nách xuống tay. Mồ hôi chân: làm từ háng xuống.",6]]},{ten:"Bụng và lưng",the:[["Ăn thịt bao nhiêu là vừa","Hàm răng người có nhiều răng cối, răng cửa để nhai thực vật, chỉ 4 răng nanh và không dài. Đồ ăn từ động vật nên chiếm tối đa khoảng 20%.\nHôm ăn nhiều thịt thấy nặng nề; hôm ăn rau thấy nhẹ người: đó là cơ thể báo.",0],["Não thèm hay thân thèm","Cô ăn chay hơn một năm, thấy cá khô vẫn thèm vì ký ức. Đưa lên mũi thì cơ thể phản ứng, ăn vào phải nhè ra. Phải đủ tinh tế mới phân biệt được não thèm và thân thèm. Thiền động giúp lắng nghe cơ thể tốt hơn.",9],["Gan thận ở hai bên lườn","Gan, thận nằm vùng lườn và thắt lưng. Bóp vào đó đau là có vấn đề. Bóp, véo, vỗ rung để máu về nuôi. Véo bụng phải thấy có cơ bên dưới, mỡ chỉ khoảng 5 phân.",3],["Xoa bụng thuận hay ngược","Táo bón: xoa cả bụng theo chiều kim đồng hồ. Sa tử cung, sa trực tràng: xoa ngược chiều kim đồng hồ. Vẫn phải véo bụng cho cơ khỏe để nâng đỡ ruột.",0],["Tiểu đường type 2","Day bụng, lườn, vỗ rung. Không kiêng hẳn đường mà ăn ít, dùng đường thô. Gạo lật hoặc trộn gạo lứt. Ngâm đậu bắp vào nước qua đêm, hôm sau uống.\nĐo đường huyết sau món mới, món nào làm đường tăng thì giảm. Thủy liệu kích thích trao đổi chất.",0],["Bệnh ngoài da","Từ bên trong phát ra (viêm da cơ địa, á sừng): do gan thận yếu, làm vùng lườn và thắt lưng.\nTừ ngoài vào (nấm, lang ben, hắc lào): bôi ngoài. Lang ben bôi nước củ riềng giã. Nấm thì tắm và bôi lá bàng.",0]]},{ten:"Bụng dưới và chân",the:[["Vùng chùm đuôi ngựa","Từ thắt lưng xuống mông là vùng dây thần kinh chùm đuôi ngựa, bàng quang, tử cung, phần phụ của nam. Làm mềm sâu cơ vùng này, xương cụt, háng, bụng dưới, vùng mu. Cả nam và nữ phải day cho vùng mu không còn đau.",3],["Giãn tĩnh mạch","Cơ sâu ở đùi bị bó chặt thì áp lực dồn ra mao mạch ngoài da, lâu ngày giãn tĩnh mạch. Ngâm chân, ngâm xông mà chưa làm thông cơ sâu thì vô ích. Phải làm giãn cơ sâu trước rồi mới ngâm.",1],["Chân: làm từ trên xuống","Đầu gối: làm từ mông, đùi xuống. Cổ chân, gót, ngón chân: làm từ đầu gối xuống. Gốc tắc phía trên thì máu không xuống nuôi phía dưới.",5],["Cao huyết áp","Phần trên thông nhưng từ tim trở xuống tắc nên máu dồn lên. Làm thông phần dưới, kết hợp ăn ít thịt.",1]]},{ten:"Tâm và gia đình",the:[["Bệnh tâm lý của trẻ","Hầu hết bệnh của trẻ dưới 18 tuổi, nhất là bệnh tâm lý, đến từ bố mẹ. Bố mẹ xả được suy nghĩ tiêu cực, bệnh tật bên trong thì con thay đổi.\nNgười ngoài chỉ giúp được bằng cách trò chuyện, chơi với trẻ, day đầu cho trẻ, chăm bố mẹ trẻ trước để họ tin.",9],["Trong mình có cả bố mẹ","Bên trong mỗi người ít nhất có hai người: bố và mẹ mình. Còn có cả xã hội: phụ nữ phải thế này, học xong phải thế kia. Nhìn ra thì thấy vấn đề người xung quanh cũng vậy.",9],["Khi người thân nóng tính","Không bắt được người già bỏ tính đã hun đúc nhiều năm. Mình không tức giận, chỉ nhẹ nhàng hỏi lại.\nQuay về chăm sóc, day bóp cho bố mẹ: năng lượng từ trái tim đến trái tim thì người ta mới có động lực thay đổi.",9],["Học online để làm cho nhà mình","Khóa online giúp chữa cho mình và người thân gần nhất. Chữa cho người khác thì phải học trực tiếp, nghiêm túc và dài, vì bệnh đến chủ yếu từ bên trong.",0],["Nhận biết thiếu máu","Lưỡi không đỏ là thiếu máu. Bổ máu bằng hà thủ ô, đường mía, củ dền, các loại rau. Nhưng quan trọng nhất là làm thông, hấp thu được thì mới đủ máu.",10]]}]},{ma:"b5",so:5,ten:"Chăm sóc bé sữa và ăn dặm",nguon:"Bài 5",video:"https://youtu.be/WTIBpSGR5as?si=FqlcSKoGB2K9XK5s",rumble:"https://rumble.com/v3amowg-cssk-k5-b5-chm-sc-b-sa-v-n-dm.html",muc:[{ten:"Ba ngày đầu",the:[["Sữa non","72 giờ đầu mẹ chỉ có sữa non, chưa thấy căng sữa. Sữa non ít, sánh, màu trắng trong như nhựa chuối nhưng rất nhiều kháng thể, đúng thứ bé cần khi vừa ra ngoài. Bé bú vì bản năng, chưa phải vì đói.",0],["Biết đủ sữa","Đếm số lần tè: ngày 1 một lần, ngày 2 hai lần, mỗi ngày thêm một, tới ngày 7 khoảng 6–8 lần là đủ.\nBé thường bú trong giờ đầu, có bé 6–12 giờ. Quá 24 giờ không bú là bất thường.",0],["Ngậm gì đầu tiên","Như gà con nhận người đầu tiên là mẹ, bé ngậm cái gì đầu tiên sẽ nhận cái đó. Cho bú bình đầu tiên thì bé chê ti mẹ. Phải tách mẹ lâu thì nhỏ vài giọt sữa vào mép cho bé tự liếm.",0],["Dấu hiệu bình thường","Bé trai tè màu gạch non, bé gái ra dịch trắng ở vùng kín: bình thường. Da hồng hoặc đỏ tươi: bình thường. Da tím, tái: bất thường.",0],["Ánh sáng","24 giờ đầu tránh ánh sáng mạnh. Ngày 2 kéo rèm cho tiếp ánh sáng trong bóng râm. Ngày 3 cho phơi nắng, che mặt bé.\nVàng da sinh lý: phơi nắng và massage hai bên vùng gan thận. Vàng cả bàn tay, bàn chân, mắt là vàng da bệnh lý.",0]]},{ten:"Tháng đầu",the:[["Bé quấy ngày thứ hai","Lần đầu tiêu hóa sữa mẹ nên hay đầy hơi. Chườm ấm bụng bằng túi chườm hoặc khăn sấy ấm, có thể đắp lá trầu trước bụng và sau lưng. Massage lưng cho con để bớt đầy hơi.",0],["Mẹ ăn gì","Tháng đầu ruột bé phát triển nhiều. Mẹ ăn chín uống sôi, không ăn đồ qua đêm, đồ ôi thiu, đồ tính hàn lạnh.",0],["Rốn và tắm","Rốn khô thoáng thì rụng nhanh, thường 3–4 ngày, chậm thì 7 ngày. Chưa rụng rốn chưa cần tắm. Sau đó tắm nước ấm pha chút muối hoặc nước lá, tắm xong massage cho con.",0],["Phân của bé","Phân xì xẹt, nhiều màu là bình thường, có sợi máu cũng chưa đáng lo. Bất thường là phân bạc trắng hoàn toàn, hoặc đen hoàn toàn.",0],["Đánh trứng bạc","Dùng khi con sốt, co giật mà không sốt, hoặc vàng da kéo dài. Lăn trứng bọc bạc từ đầu xuống chân khắp người; bạc đen thì làm trắng lại rồi lăn tiếp tới khi bạc không đen. Kiêng gió, kiêng nước 1 giờ.\nMỗi ngày một lần, khi sốt cao có thể hai lần. Gừng thì đợi con ngoài 1–2 tuổi.",0],["Làm bạc trắng lại","Hơ trên lửa bếp ga; hoặc đun trong nước cốt chanh pha muối; hoặc ngâm chanh muối trong đồ nhôm.",0]]},{ten:"Sốt và vi khuẩn",the:[["Môi trường gây bệnh","Vi sinh có khắp nơi: da, miệng, ruột, máu, tay nắm cửa, điện thoại. Cái gây bệnh là môi trường. Để rác lâu trong nhà thì sinh bệnh; cơ thể có nhiều thứ không dùng được thì thành rác, gan thận da thải không kịp thì sinh bệnh. Vẫn phải vệ sinh sạch sẽ.",2],["Hệ miễn dịch lớn dần","Trong bụng mẹ, bé thích nghi với hệ khuẩn của mẹ. Ra ngoài, bé tiếp xúc rộng dần và hệ khuẩn phong phú dần. Khoảng trên 12 tuổi mới tương đương người lớn.",0],["Sốt là bình thường","Mọc răng, học lẫy, học bò hay sốt. Mỗi trận ốm giúp hệ miễn dịch được tập luyện. Người lớn mỗi năm nên ốm sốt 1–2 lần; mấy năm không sốt là hệ miễn dịch đang kém. Bé dưới 1–3 tháng sốt thì phải xử lý ngay.",0],["Hỗ trợ khi con sốt","Chườm ấm, da kề da với con, đánh trứng bạc, ngâm nước tía tô pha muối khoảng 5 phút rồi lau khô. Sốt cao mà không kiểm soát được tình hình thì đưa con đến bệnh viện.",0],["Phòng co giật","Co giật thường do tắc nghẽn, thiếu máu lên não, rối loạn tuần hoàn máu não, và da thải độc kém. Hằng ngày làm thông cho con thì khi bệnh con phục hồi tốt. Đừng cho con nhỏ nghịch điện thoại.",1]]},{ten:"Lớn lên",the:[["Cân nặng","6 tháng: gấp đôi lúc sinh. 12 tháng: gấp ba (khoảng 8–10 kg). Sau đó mỗi năm tăng khoảng 2 kg. Nuôi kiểu gà ta lớn chậm nhưng khỏe về sau. Lưng, cổ, đầu con mềm là con khỏe.",3],["Con ăn kém","Day lưng, vỗ rung bụng cho con. Ngâm thủy liệu, xong con sẽ đói, ruột nở ra. Lưỡi trắng, nấm lưỡi: bôi nước lá bàng hoặc rau ngót giã muối, hoặc dầu dừa.",0],["Khò khè, nghẹt mũi khi ngủ","Con bị nhiễm hàn. Bơm máu lên não, day mũi, cổ, ngực cho con. Đường thở thông là hết.",5],["Thiên nhiên và chân trần","Cho con chân trần tiếp đất, chơi với thiên nhiên, tiếp năng lượng mặt trời. Tắm mưa khi trời ấm và mưa đã lâu.",0]]},{ten:"Ăn dặm",the:[["Khi nào bắt đầu","Khi phân con chuyển từ mùi chua sang mùi thối là men tiêu hóa đã sẵn sàng. Chờ thêm 3–4 tuần, khoảng 6 tháng thì bắt đầu. Dưới 12 tháng sữa mẹ vẫn là chính, ăn chỉ để làm quen.",0],["Từng giai đoạn","6–7 tháng: 2 tuần đầu bột gạo nấu sữa mẹ hoặc nước rau củ, không nêm; sau thêm 1 củ 1 rau.\n7–8 tháng: cháo kèm rau củ.\nTừ 8 tháng: cơm nát, tăng độ thô để tập nhai. Dưới 12 tháng múc phần của con ra trước khi nêm.",0],["Mục đích ăn dặm","Cho con gia nhập bữa ăn gia đình, không phải để to béo. Cả nhà ăn gì thì con tập ăn nấy, không làm chế độ ăn riêng. Luôn cho con ngồi ăn, tập trung ăn, nhai kỹ.",0],["Nề nếp bữa ăn","Không ăn rong, không xem iPad. Ăn vặt rồi bỏ bữa thì chờ tới bữa sau. Con cần cả tự do và quy củ: biết chỗ nào được tự do, chỗ nào phải theo nội quy.",0]]},{ten:"Cho bú và cai sữa",the:[["Giảm cữ dần","Dưới 12 tháng: bú theo nhu cầu. 12–18 tháng: 3–4 cữ một ngày, có giờ. 18–24 tháng: 2–3 cữ. Khoảng 2 tuổi: 1–2 cữ, mỗi cữ 5–10 phút. Khoảng 2,5 tuổi: 1 cữ 5 phút rồi cai. Giảm dần, không cắt đột ngột.",0],["Đừng lấy ti dỗ mọi cảm xúc","Con buồn cho ti, con khóc cho ti, con chán cũng cho ti thì cũng như lớn lên buồn đi nhậu, vui cũng đi nhậu. Sau 12 tháng phải cho con vào nề nếp.",0],["Có bầu khi còn cho bú","Trong 2–3 tháng giảm dần còn 1 cữ một ngày, vì bầu to và chăm hai con mẹ sẽ kiệt sức. Bú song song thì cho lần lượt, nói chuyện với con lớn, không cần đứa nào nhường đứa nào.",0],["Cai bú đêm","Khoảng 20–22 tháng, trẻ khỏe sẽ tự ngủ xuyên đêm. Nếu chưa: nói chuyện với con trước một tuần, rồi nhờ bố dỗ khi con thức. Khoảng một tuần con quen.",0]]},{ten:"Kết nối mẹ con",the:[["Bú mẹ là truyền tình yêu","Phụ nữ có thêm hai luân xa phụ ở hai đầu ngực, gần luân xa tim. Cho con bú là kích thích luân xa tim và truyền năng lượng tình yêu cho con, không chỉ là cho ăn.",0],["Từ một thành hai","Trong bụng, mẹ con nối bằng dây rốn. Ra ngoài, nối qua bú mẹ. Cai sữa rồi vẫn nối vô hình. Lớn lên con phải tách hẳn thành người độc lập. Đừng để mẹ bám con hay con bám mẹ.",0],["Không bù đắp kiểu nạn nhân","Con từng chịu thiệt thì đừng thương xót bù đắp mãi, con sẽ thấy mình đáng thương và yếu đi. Hãy cho con nhìn sự thật để sau này con tự sửa chữa cho mình.",0]]}]},{ma:"b6",so:6,ten:"Buổi chia sẻ: vì sao kết hợp nhiều pháp",nguon:"Chia sẻ",video:"",muc:[{ten:"Vì sao kết hợp nhiều pháp",the:[["Mỗi thầy một pháp","Cô từng bệnh rất nặng: mù tạm thời, cột sống sụp, nằm muốn dậy phải bò. Đi nhiều thầy, mỗi thầy chỉ dùng một pháp nên bệnh bớt rồi lại bị lại. Cô tự làm trên thân mình, pháp nào hiệu quả thì ghép vào.",4],["Bốn tầng, bốn pháp","Khí: hỏa liệu. Thần kinh: đi điện. Máu: chích lễ. Cơ và dây chằng: day bóp, nắn chỉnh. Mỗi pháp chỉ tới một tầng, nên phải kết hợp.",4],["Cây khô không dẫn điện","Điện tác động được thần kinh nhưng không tới khí. Chỗ đã vôi, chai, thoái hóa thì điện chịu, như cây tươi thì dẫn điện, cây khô thì không.\nHỏa liệu tới được khí nhưng không tới thần kinh và không nắn chỉnh được. Máu ứ lâu ngày thì các pháp kia chỉ thải bớt, buộc phải chích giác.",4],["Day bóp có giới hạn","Xương không tự lệch mà do cơ và dây chằng kéo. Day bóp, nắn chỉnh tác động vào đó, nhưng đau nên không làm liên tục được, và không tới được thần kinh đã tổn thương.",4]]},{ten:"Mềm là sống",the:[["Gan mềm mới là gan ngon","Ngày xưa đi chợ, mẹ dặn chọn gan mềm, gan cứng không ngon. Phổi, thận, gan, ruột mềm mại mới là khỏe. Mình chỉ làm cho nó mềm đi, sống lại.",3],["Xì ra rồi mới hết","Khi làm, cái bên trong sẽ nổi ra: chỗ đi điện sưng đỏ là đang xì viêm; mặt đùn mụn hơn một tháng; viêm da cơ địa chảy nước. Nhìn có vẻ nặng nhưng phải vượt qua giai đoạn đó thì mới hết.",7],["Mụn mới khác mụn cũ","Mụn cũ có mủ. Mụn xì ra khi làm thì khô, bong ra, da vẫn ẩm và mềm, không để lại sẹo.",7]]},{ten:"Làm theo sức",the:[["Đừng tham","Xem tình trạng người được làm trước. Hỏi có mệt không; mệt thì ngưng, chỉ đốt 2 lửa. Có người lần đầu đốt cả chân, lưng, mặt, tối về tim đập mạnh.",8],["Tăng dần","Người nhịp tim cao: đưa nhịp tim về dưới 90 trước, chỉ đốt lưng 2 lần, làm dài ngày rồi mới thêm chân. Người đã ổn mới đốt nhiều: lưng 3 lần, chân 2 lần.",8],["Đi điện: nhịp làm","Bình thường đi cách ngày cũng được. Bệnh nặng, có u cục thì làm liền nhiều ngày cho nhanh tiêu. Có thể làm trước khi đi ngủ. Sa tử cung: đi bụng, ngực, hai bên lườn, đều và dài ngày.",4]]},{ten:"Người làm nghề",the:[["Ba phẩm chất","Thương người: thấy người đau thì muốn giúp. Kiên trì, nhẫn nại, chịu khó. Trung thực, thật thà: người chưa tin thì chinh phục từ từ bằng tình yêu thương.",0],["Làm cho mình trước","Chăm mình thế nào thì chăm con, chăm chồng như thế, rồi chăm người khác cũng như thế. Hai người ở gần nhau làm cho nhau là đẹp nhất, vì người làm cũng cần được bảo dưỡng.",0],["Hiểu sau khi làm","Có học viên làm theo quán tính hơn một năm mới hiểu. Cứ kiên trì thực hành, không cần giỏi giang hoạt bát. Cái gì chưa hiểu thì hỏi.",0]]},{ten:"Thiền thư giãn",the:[["Dừng được suy nghĩ","Nghe bài thiền thư giãn 30 phút. Ban đầu chưa tới 5 phút đầu đã bay đi đâu. Nhận ra đầu đang nghĩ thì quay lại nghe. Suy nghĩ là thói quen, như bánh xe đạp cứ quay, phải tập mới dừng được. Cô mất hơn một tháng.",9],["Hay ngủ quên","Tập ngay sau giấc ngủ trưa, lúc tỉnh táo nhất trong ngày. Nghe buổi tối xong bị tỉnh, khó ngủ lại thì chỉ nghe ban ngày.",0],["Được gì","Gặp chuyện bực tức thì gạt được suy nghĩ, kệ nó, để đầu óc trống và tâm an. Không bị câu chuyện cuốn đi.",9]]}]}],NOI_DUNG_GOC=function(){const n=BAI_RAW.map(n=>({ma:n.ma,so:n.so,ten:n.ten,nguon:n.nguon,video:n.video,rumble:n.rumble||"",luuY:n.luuY||[],muc:n.muc.map((t,h)=>{const a=n.ma+"-m"+(h+1);return{ma:a,ten:t.ten,the:t.the.map((n,t)=>({ma:a+"-t"+(t+1),tieu_de:n[0],noi_dung:n[1],nl:n[2]?"nl-"+n[2]:""}))}})})),t=PHUONG_PHAP.map(n=>({...n,buoc:n.buoc.map((t,h)=>({ma:n.ma+"-s"+(h+1),cau:t[0],phu:t[1],phut:t[2]||0}))})),h=BAI_THUC_HANH.map(n=>({...n,buoc:n.buoc.map((t,h)=>({ma:n.ma+"-s"+(h+1),cau:t[0],phu:t[1],phut:t[2]||0}))}));return{loi_tang:LOI_TANG,cau_goc:CAU_GOC,nguyen_ly:NGUYEN_LY,tang:TANG,so_do:SO_DO_BAI,giai_benh:GIAI_BENH,luan_xa:LUAN_XA,vung:VUNG,trieu_chung:TRIEU_CHUNG,phuong_phap:t,bai_thuc_hanh:h,cham_con:{tren3:CHAM_CON_TREN3,nho:CHAM_CON_NHO},di_vien:DI_VIEN,bai:n}}();!function n(t){Object.freeze(t),Object.values(t).forEach(t=>{t&&"object"==typeof t&&!Object.isFrozen(t)&&n(t)})}(NOI_DUNG_GOC);const G=NOI_DUNG_GOC,MUC_GOC={},THE_GOC={},BAI_CUA_MUC={};G.bai.forEach(n=>n.muc.forEach(t=>{MUC_GOC[t.ma]=t,BAI_CUA_MUC[t.ma]=n.ma,t.the.forEach(n=>{THE_GOC[n.ma]={...n,muc:t.ma}})}));const PP={};G.phuong_phap.forEach(n=>PP[n.ma]=n);const BTH={};G.bai_thuc_hanh.forEach(n=>BTH[n.ma]=n);const NL={};G.nguyen_ly.forEach(n=>NL[n.ma]=n);const $=n=>document.querySelector(n);function esc(n){return String(null==n?"":n).replace(/[&<>"]/g,n=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[n]))}function vanBan(n){return esc(n).replace(/\n/g,"<br>")}function homNay(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"nu
